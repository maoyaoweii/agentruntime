plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agenttestapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.agenttestapp'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
