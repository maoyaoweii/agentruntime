name: Android DSH checks
on:
  pull_request:
  push:
    branches: [main, 'codex/dsh-mobile-*']
permissions:
  contents: read
concurrency:
  group: android-dsh-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.8'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - name: Render native Android view previews
        run: gradle --no-daemon --console=plain -Pdsh.capture.ui=true :agent:testDebugUnitTest --tests 'com.agentruntime.dsh.DshScreenshotTest'
      - name: Save native Android view previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-ui-previews
          retention-days: 14
          if-no-files-found: error
          path: agent/build/ui-captures/
      - name: Test, lint and build
        run: gradle --no-daemon --console=plain :agent:testDebugUnitTest :agent:testReleaseUnitTest :agent:lintDebug :agent:lintRelease :agent:assembleDebug :agent:assembleRelease
      - name: Save build and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-android-checks
          retention-days: 14
          path: |
            agent/build/reports/
            agent/build/test-results/
            agent/build/outputs/apk/
  ocr-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.8'
      - name: Build app and synthetic screen fixture
        run: gradle --no-daemon --console=plain :agent:assembleDebug :agent:assembleDebugAndroidTest :agenttestapp:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recognize two drawn screens on Android 11
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: DSH_OCR_DISPOSABLE_EMULATOR=yes bash tools/verify_ocr_emulator.sh
