org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 主代码零 AndroidX 依赖（纯 framework API），但 Robolectric 的测试期依赖会带进
# androidx.test:monitor 等包，AGP 因此在"测试配置含 AndroidX 而 useAndroidX=false"时
# 直接中断构建。这里打开它只是为了满足测试期校验，主 APK 的依赖树没有变化。
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# 工程路径包含中文（E:/女朋友恋爱软件），AGP 默认会中断构建。
# 本工程无 NDK / native 代码，AAPT2 与 javac 均可正确处理 UTF-8 路径。
android.overridePathCheck=true
